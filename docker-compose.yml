version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: food-recommender-backend
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - DEVICE=cpu
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food-recommender-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

